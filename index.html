hn_hi:[`Xin chào mọi người 👋`,`Hello everyone 👋`,`Всем привет 👋`,`Olá a todos 👋`],
hn_lead:[`Đây là trang web tổng hợp đầy đủ mọi thứ bạn cần để có thể sử dụng file do tôi làm một cách mượt mà nhất.`,`This site brings together everything you need to use my files as smoothly as possible.`,`Здесь собрано всё, что нужно, чтобы максимально удобно пользоваться моими файлами.`,`Este site reúne tudo o que você precisa para usar meus arquivos da forma mais tranquila possível.`],
hn_1t:[`Full 100% map, không sót một rương`,`100% map completion, not a single chest missed`,`100% карты, ни одного пропущенного сундука`,`100% do mapa, sem perder nenhum baú`],
hn_1p:[`File tôi làm đều cố gắng để khi các bạn dùng có thể full 100% map các vùng và không sót một rương nào.`,`I do my best to make every file let you clear 100% of every region without missing a single chest.`,`Я стараюсь делать каждый файл так, чтобы вы прошли все регионы на 100% и не пропустили ни одного сундука.`,`Faço cada arquivo para que você complete 100% de todas as regiões sem deixar nenhum baú para trás.`],
hn_2t:[`Hướng dẫn có sẵn ngay trong file`,`Guides built right into the file`,`Подсказки прямо в файле`,`Guias dentro do próprio arquivo`],
hn_2p:[`Có đầy đủ hướng dẫn giải đố, lưu ý và nhắc nhở. Nếu bạn bí hoặc mắc kẹt ở bất kỳ chỗ nào, câu trả lời đã nằm sẵn trong file.`,`Full puzzle solutions, notes and reminders are included. If you get stuck anywhere, the answer is already in the file.`,`В файле есть решения головоломок, заметки и напоминания. Если вы застряли, ответ уже внутри.`,`Soluções de quebra-cabeças, avisos e lembretes estão incluídos. Se travar em algum ponto, a resposta já está no arquivo.`],
hn_3t:[`Dùng thường xuyên? Thử app của tôi`,`Use them often? Try my app`,`Пользуетесь часто? Попробуйте моё приложение`,`Usa com frequência? Experimente meu app`],
hn_3p:[`Nếu các bạn thường xuyên dùng file thì có thể tham khảo thử app của tôi. Xem qua tính năng và giao diện rồi tải nếu ưng.`,`If you use the files regularly, check out my app. Look over the features and interface, then download it if you like it.`,`Если вы часто пользуетесь файлами, загляните в моё приложение. Посмотрите возможности и интерфейс, а затем скачайте, если понравится.`,`Se você usa os arquivos com frequência, dê uma olhada no meu app. Veja os recursos e a interface e baixe se gostar.`],

app_lead:[`App dành cho bạn nào hay dùng file: nhập file nhanh, tự cập nhật dữ liệu và tự cập nhật chính nó, không phải tải tay từng lần.`,`An app for people who use the files often: import quickly, keep data up to date and update itself, with no manual downloading each time.`,`Приложение для тех, кто часто пользуется файлами: быстрый импорт, автообновление данных и самого приложения, без ручной загрузки.`,`Um app para quem usa os arquivos com frequência: importa rápido, atualiza os dados e a si mesmo, sem baixar tudo manualmente.`],

app_f2p:[`App tự đọc kho file và lấy bản mới khi tôi cập nhật, bạn luôn có file mới nhất.`,`The app reads the file library and fetches new versions as I update them, so you always have the latest.`,`Приложение читает хранилище и подтягивает новые версии, поэтому у вас всегда свежие файлы.`,`O app lê o acervo e busca novas versões quando eu atualizo, então você sempre tem o mais recente.`],

app_f3p:[`Có bản mới là app tự báo và cập nhật, không cần tải lại bộ cài.`,`When a new version is out the app updates itself, no need to download the installer again.`,`Когда выходит новая версия, приложение обновляется само, заново скачивать установщик не нужно.`,`Quando sai uma versão nova, o app se atualiza, sem precisar baixar o instalador de novo.`],

gal1p:[`Tải từ kho online, tự giải nén và xếp theo vùng, ngôn ngữ, loại file. App kiểm tra cập nhật mỗi lần mở và mỗi 24 giờ.`,`Downloads from the online store, unpacks and sorts by region, language and type. The app checks for updates on every launch and every 24 hours.`,`Загрузка из онлайн-хранилища, автоматическая распаковка и сортировка по региону, языку и типу. Проверка обновлений при каждом запуске и каждые 24 часа.`,`Baixa do repositório online, descompacta e organiza por região, idioma e tipo. O app verifica atualizações a cada abertura e a cada 24 horas.`],

x_how1p:[`Vào Kho File rồi chọn vùng bạn cần. Trên máy tính, rê chuột vào ô ở mép phải màn hình để đổi vùng nhanh.`,`Open the File Library and pick the region you need. On desktop, hover the box on the right edge of the screen to switch regions quickly.`,`Откройте «Хранилище файлов» и выберите нужный регион. На компьютере наведите курсор на блок у правого края экрана, чтобы быстро сменить регион.`,`Abra a Biblioteca de arquivos e escolha a região. No computador, passe o mouse sobre a caixa na borda direita da tela para trocar de região rapidamente.`],

x_how2p:[`File tổng gộp toàn bộ điểm của vùng. File chia lẻ tách theo nhóm: Rương, Đánh Quái, Khiêu Chiến, Tiên Linh, Giải Đố. Tick nhiều file để tải một lần dưới dạng .zip.`,`The full file merges every point of the region. Split files are grouped by category: Chests, Combat, Challenges, Seelie, Puzzles. Tick several files to download them at once as a .zip.`,`Полный файл объединяет все точки региона. Файлы по группам разделены по категориям: Сундуки, Бои, Испытания, Селли, Загадки. Отметьте несколько файлов, чтобы скачать их одним .zip.`,`O arquivo completo reúne todos os pontos da região. Os arquivos divididos são separados por categoria: Baús, Combate, Desafios, Seelie, Enigmas. Marque vários arquivos para baixar de uma vez em .zip.`],

x_how3p:[`Mở app và nhập file .zip vừa tải (không cần giải nén), app tự phân loại theo tên file nên đừng đổi tên. Nếu file lỗi hoặc không đọc được, xem <a href="#/faq">câu hỏi thường gặp</a>.`,`Open the app and import the .zip you just downloaded (no need to unzip). The app sorts files by file name, so don't rename them. If a file is broken or unreadable, see the <a href="#/faq">FAQ</a>.`,`Откройте приложение и импортируйте скачанный .zip (распаковывать не нужно). Приложение сортирует файлы по имени, поэтому не переименовывайте их. Если файл повреждён или не читается, см. <a href="#/faq">частые вопросы</a>.`,`Abra o app e importe o .zip baixado (não precisa descompactar). O app classifica pelo nome do arquivo, então não renomeie. Se o arquivo estiver com erro ou não abrir, veja as <a href="#/faq">perguntas frequentes</a>.`],
path:[`Mở app Electro Cat và nhập file .zip vừa tải (không cần giải nén). App tự phân loại theo TÊN FILE nên đừng đổi tên file.`,`Open the Electro Cat app and import the .zip you just downloaded (no need to unzip). The app sorts files by FILE NAME, so don't rename them.`,`Откройте приложение Electro Cat и импортируйте скачанный .zip (распаковывать не нужно). Приложение сортирует файлы по ИМЕНИ, поэтому не переименовывайте их.`,`Abra o app Electro Cat e importe o .zip baixado (não precisa descompactar). O app classifica pelo NOME DO ARQUIVO, então não renomeie.`],
g1t:[`Chọn vùng và ngôn ngữ`,`Choose a region and language`,`Выберите регион и язык`,`Escolha a região e o idioma`],
g1p:[`Vào Kho File, chọn vùng cần dùng rồi chọn ngôn ngữ ở đầu trang vùng.`,`Open the File Library, pick the region you need, then choose a language at the top of the region page.`,`Откройте «Хранилище файлов», выберите регион, затем язык в верхней части страницы региона.`,`Abra a Biblioteca de arquivos, escolha a região e depois o idioma no topo da página da região.`],
g2p:[`File tổng gộp toàn bộ điểm. File chia lẻ tách theo nhóm. Tick nhiều file để tải một lần dưới dạng .zip.`,`The full file merges every point. Split files are grouped by category. Tick several files to download them at once as a .zip.`,`Полный файл объединяет все точки. Файлы по группам разделены по категориям. Отметьте несколько файлов, чтобы скачать их одним .zip.`,`O arquivo completo reúne todos os pontos. Os arquivos divididos são separados por categoria. Marque vários arquivos para baixar de uma vez em .zip.`],

g3p:[`Nếu file có mã SHA-256, so mã đó với mã tính từ file đã tải (xem mục FAQ).`,`If the file has a SHA-256 hash, compare it with the hash computed from the downloaded file (see the FAQ).`,`Если у файла есть хеш SHA-256, сравните его с хешем скачанного файла (см. раздел FAQ).`,`Se o arquivo tiver hash SHA-256, compare-o com o hash calculado do arquivo baixado (veja as FAQ).`],

faq1q:[`Dùng file đã tải như thế nào?`,`How do I use a downloaded file?`,`Как использовать скачанный файл?`,`Como usar o arquivo baixado?`],
faq2q:[`File tổng và file chia lẻ khác nhau thế nào?`,`What is the difference between the full file and split files?`,`Чем отличается полный файл от файлов по группам?`,`Qual a diferença entre o arquivo completo e os arquivos divididos?`],
faq2a:[`File tổng gộp toàn bộ điểm của một vùng, file chia lẻ tách theo nhóm (Rương, Đánh Quái, Khiêu Chiến, Tiên Linh, Giải Đố) để bạn chọn dùng.`,`The full file merges every point of a region. Split files are grouped by category (Chests, Combat, Challenges, Seelie, Puzzles) so you can pick what you need.`,`Полный файл объединяет все точки региона. Файлы по группам разделены по категориям (Сундуки, Бои, Испытания, Селли, Загадки), чтобы вы могли выбрать нужное.`,`O arquivo completo reúne todos os pontos de uma região. Os arquivos divididos são separados por categoria (Baús, Combate, Desafios, Seelie, Enigmas) para você escolher o que usar.`],
faq3q:[`File tải về bị lỗi hoặc không đọc được?`,`A downloaded file is broken or unreadable?`,`Скачанный файл повреждён или не читается?`,`O arquivo baixado está com erro ou não abre?`],
faq3a:[`Hãy thử tải lại và kiểm tra đúng vùng, đúng ngôn ngữ. Nếu vẫn lỗi, vào mục Báo lỗi / Đóng góp và gửi kèm tên file, vùng, ngôn ngữ.`,`Try downloading it again and check that the region and language are correct. If it still fails, go to Report / Contribute and send the file name, region and language.`,`Попробуйте скачать файл ещё раз и проверьте, что регион и язык выбраны верно. Если ошибка осталась, откройте раздел «Сообщить об ошибке / Помочь» и отправьте название файла, регион и язык.`,`Tente baixar novamente e confira se a região e o idioma estão corretos. Se continuar com erro, vá em Reportar / Contribuir e envie o nome do arquivo, a região e o idioma.`],
faq4q:[`Làm sao biết file không bị sửa đổi?`,`How can I tell a file hasn't been modified?`,`Как убедиться, что файл не изменён?`,`Como saber se o arquivo não foi alterado?`],
faq4a:[`Nếu file có mã SHA-256, bấm nút SHA-256 để chép mã rồi so với mã tính từ file đã tải. Windows: certutil -hashfile ten-file.zip SHA256. Linux/macOS: sha256sum ten-file.zip (hoặc shasum -a 256 ten-file.zip).`,`If a file has a SHA-256 hash, click the SHA-256 button to copy it and compare it with the hash computed from your downloaded file. Windows: certutil -hashfile file-name.zip SHA256. Linux/macOS: sha256sum file-name.zip (or shasum -a 256 file-name.zip).`,`Если у файла есть хеш SHA-256, нажмите кнопку SHA-256, чтобы скопировать его, и сравните с хешем скачанного файла. Windows: certutil -hashfile file-name.zip SHA256. Linux/macOS: sha256sum file-name.zip (или shasum -a 256 file-name.zip).`,`Se o arquivo tiver hash SHA-256, clique no botão SHA-256 para copiá-lo e compare com o hash calculado do arquivo baixado. Windows: certutil -hashfile file-name.zip SHA256. Linux/macOS: sha256sum file-name.zip (ou shasum -a 256 file-name.zip).`],
faq5q:[`File cũ còn dùng được không?`,`Can I still use old files?`,`Можно ли ещё использовать старые файлы?`,`Os arquivos antigos ainda podem ser usados?`],
faq5a:[`File cũ được giữ lại để dùng khi cần. Nên ưu tiên bản mới nhất và đọc ghi chú của file để biết khác biệt.`,`Old files are kept for when you need them. Prefer the newest version and read the file's note to see what changed.`,`Старые файлы сохранены на случай, если они понадобятся. Лучше использовать новейшую версию и прочитать примечание к файлу, чтобы узнать, что изменилось.`,`Os arquivos antigos são mantidos para quando precisar. Prefira a versão mais recente e leia a nota do arquivo para saber o que mudou.`],
faq6q:[`Làm sao biết có file mới?`,`How do I know when there are new files?`,`Как узнать о новых файлах?`,`Como saber se há arquivos novos?`],
faq6a:[`Xem mục Cập nhật: có nhật ký thay đổi và danh sách file mới nhất. Tải bản mới rồi thay file cũ.`,`Check the Updates page: it has a change log and the list of the newest files. Download the new version and replace the old file.`,`Загляните в раздел «Обновления»: там журнал изменений и список новых файлов. Скачайте новую версию и замените старый файл.`,`Veja a página Atualizações: há um histórico de mudanças e a lista dos arquivos mais recentes. Baixe a nova versão e substitua o arquivo antigo.`],
